[project]
name = "bg-skills"
version = "0.1.0"
description = "Board game definitions that agents can read, operate and play"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
bg = "bgskills.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bgskills"]

[dependency-groups]
dev = ["pytest>=8"]
